<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ArtPrompt — Studio Reference Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ArtPrompt">
  <meta name="theme-color" content="#09090b">

  <!-- Embedded Web App Manifest -->
  <link rel="manifest" href="data:application/manifest+json;utf-8,%7B%22name%22%3A%22Art%20Prompt%20Daily%22%2C%22short_name%22%3A%22ArtPrompt%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2309090b%22%2C%22theme_color%22%3A%22%2309090b%22%7D">

  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(24, 24, 27, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #8b5cf6;
      --accent-gradient: linear-gradient(135deg, #8b5cf6, #ec4899);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: calc(env(safe-area-inset-top) + 14px);
      padding-bottom: calc(env(safe-area-inset-bottom) + 24px);
      padding-left: 16px;
      padding-right: 16px;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .badge {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(139, 92, 246, 0.18);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.35);
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 700;
    }

    .date-str {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* Main Prompt Card */
    .prompt-card {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      margin-bottom: 22px;
    }

    .prompt-title {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 12px;
      color: #fff;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .tag {
      font-size: 0.7rem;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 9px;
      border-radius: 8px;
      color: var(--text-muted);
    }

    /* Buttons */
    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      border: none;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 14px;
      font-weight: 600;
      transition: transform 0.12s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-primary {
      flex: 1;
      background: var(--accent-gradient);
      color: white;
      padding: 12px 16px;
      font-size: 0.92rem;
      box-shadow: 0 4px 16px rgba(139, 92, 246, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text);
      width: 44px;
      height: 44px;
      border-radius: 14px;
    }

    /* Custom Input Sheet */
    .custom-input-box {
      margin-top: 14px;
      display: none;
      gap: 8px;
    }

    .custom-input-box.active {
      display: flex;
    }

    .custom-input-box input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      user-select: text;
    }

    .custom-input-box button {
      background: #8b5cf6;
      color: white;
      padding: 0 14px;
      border-radius: 12px;
      font-size: 0.82rem;
    }

    /* Reference Gallery */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    /* Large Feature Reference (Card 1) */
    .gallery .ref-card:first-child {
      grid-column: span 2;
      height: 220px;
    }

    .ref-card {
      position: relative;
      height: 160px;
      border-radius: 16px;
      overflow: hidden;
      background: #141416;
      border: 1px solid var(--card-border);
    }

    .ref-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .ref-card img.loaded {
      opacity: 1;
    }

    .ref-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.2) 80%, transparent);
      font-size: 0.72rem;
      font-weight: 600;
      color: #f4f4f5;
    }

    .study-type {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #a78bfa;
      margin-bottom: 2px;
      display: block;
    }

    /* Skeleton Loading State */
    .skeleton-loader {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%);
      background-size: 200% 100%;
      animation: pulse 1.6s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Lightbox Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 100;
      padding: 16px;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 14px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <header>
    <span class="badge">Art Prompt</span>
    <span class="date-str" id="currentDate">Today</span>
  </header>

  <main>
    <div class="prompt-card">
      <div class="prompt-title" id="promptText">Loading prompt...</div>
      <div class="tags" id="promptTags"></div>
      
      <div class="actions">
        <button class="btn-primary" id="btnRoll">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          New Daily Roll
        </button>

        <button class="btn-secondary" id="btnToggleCustom" title="Edit Prompt">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
          </svg>
        </button>

        <button class="btn-secondary" id="btnShare" aria-label="Share">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
          </svg>
        </button>
      </div>

      <!-- Custom Prompt Box -->
      <div class="custom-input-box" id="customInputBox">
        <input type="text" id="customInput" placeholder="e.g., A witch's workshop with glowing jars in cyberpunk...">
        <button id="btnSubmitCustom">Set</button>
      </div>
    </div>

    <!-- 5 Dedicated Studies -->
    <div class="section-header">
      <h2 class="section-title">Visual References (5 Studies)</h2>
      <span class="date-str" id="statusLabel">Rendering...</span>
    </div>

    <div class="gallery" id="galleryContainer"></div>
  </main>

  <!-- Fullscreen Lightbox -->
  <div class="modal" id="modal" onclick="this.classList.remove('active')">
    <img id="modalImg" src="" alt="Fullscreen reference">
  </div>

  <script>
    const CURATED_PROMPTS = [
      {
        main: "A witch's alchemy workshop filled with glowing potion jars and cybernetic neon cables",
        style: "Cyberpunk Fantasy",
        palette: "Bioluminescent Violet & Cyan",
        detail: "glass potion bottles filled with glowing neon liquid, microchips, copper pipes",
        interior: "cluttered futuristic apothecary workbench, floating holographic runes"
      },
      {
        main: "A solitary Victorian greenhouse overgrown with giant luminous flora in deep fog",
        style: "Atmospheric Concept Art",
        palette: "Emerald Mist & Gold",
        detail: "ancient glass panes, exotic glowing fern leaves, brass watering tools",
        interior: "sprawling glass ceiling, winding iron stairs, humid sunbeams"
      },
      {
        main: "A mechanical wandering knight resting inside a sunlit meadow of red poppies",
        style: "Studio Ghibli Aesthetic",
        palette: "Vibrant Sunny Watercolor",
        detail: "engraved rusted brass armor plates, wild poppies growing through joints",
        interior: "wide sweeping hillside, distant wind turbines, fluffy white clouds"
      },
      {
        main: "A sunken gothic cathedral underwater illuminated by god rays and schooling manta rays",
        style: "Surreal Digital Painting",
        palette: "Deep Ocean Ultramarine & Sun Rays",
        detail: "barnacle-covered stone gargoyles, stained glass covered in sea moss",
        interior: "towering stone arches submerged in clear sea, drifting particles"
      },
      {
        main: "A cozy ramen stall situated at a rain-slicked neon street corner in Neo-Tokyo",
        style: "Retro Sci-Fi Illustration",
        palette: "Rainy Midnight & Amber Neon",
        detail: "steaming noodle bowls, hanging paper lanterns, reflective wet pavement",
        interior: "narrow wooden bar stool counter, condensation on window glasses"
      }
    ];

    const today = new Date();
    document.getElementById("currentDate").textContent = today.toLocaleDateString("en-US", { month: "short", day: "numeric", weekday: "short" });

    let activePrompt = CURATED_PROMPTS[0];

    function renderPrompt(promptObj) {
      document.getElementById("promptText").textContent = promptObj.main;
      const tagsEl = document.getElementById("promptTags");
      tagsEl.innerHTML = `
        <span class="tag">${promptObj.style}</span>
        <span class="tag">${promptObj.palette}</span>
        <span class="tag">5 Contextual Studies</span>
      `;
      loadReferenceStudies(promptObj);
    }

    // Generate 5 distinct, highly relevant visual reference studies for the prompt
    function loadReferenceStudies(promptObj) {
      const container = document.getElementById("galleryContainer");
      const statusLabel = document.getElementById("statusLabel");
      container.innerHTML = "";
      statusLabel.textContent = "Generating 5 studies...";

      const seedBase = Math.floor(Math.random() * 89999) + 1000;

      // 5 distinct perspectives directly based on the prompt
      const studies = [
        {
          type: "Study 1 • Scene Overview",
          label: "Full Composition",
          prompt: `${promptObj.main}, digital concept art, cinematic composition, high detail --seed ${seedBase}`
        },
        {
          type: "Study 2 • Lighting & Atmosphere",
          label: "Lighting Mood",
          prompt: `Volumetric lighting study of ${promptObj.main}, dramatic ${promptObj.palette}, atmospheric depth --seed ${seedBase + 1}`
        },
        {
          type: "Study 3 • Prop / Macro Detail",
          label: "Object & Texture Focus",
          prompt: `Close-up macro detail of ${promptObj.detail || promptObj.main}, material textures, 8k concept art --seed ${seedBase + 2}`
        },
        {
          type: "Study 4 • Environment & Space",
          label: "Interior / Background",
          prompt: `Environment concept art: ${promptObj.interior || promptObj.main}, wide establishing angle, detailed background --seed ${seedBase + 3}`
        },
        {
          type: "Study 5 • Alternate Palette",
          label: "Color & Form Study",
          prompt: `Stylized art study of ${promptObj.main}, ${promptObj.style}, masterwork digital painting --seed ${seedBase + 4}`
        }
      ];

      let loadedCount = 0;

      studies.forEach((study) => {
        const card = document.createElement("div");
        card.className = "ref-card";

        const skeleton = document.createElement("div");
        skeleton.className = "skeleton-loader";
        card.appendChild(skeleton);

        // Generate dynamic high-res concept art for each perspective
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(study.prompt)}?width=800&height=600&nologo=true`;

        const img = document.createElement("img");
        img.alt = study.label;

        img.onload = () => {
          skeleton.remove();
          img.classList.add("loaded");
          loadedCount++;
          if (loadedCount >= studies.length) {
            statusLabel.textContent = "Ready";
          }
        };

        img.onerror = () => {
          // Reliable fallback if connection stumbles
          skeleton.remove();
          img.src = `https://picsum.photos/seed/${encodeURIComponent(study.label)}/700/500`;
          img.classList.add("loaded");
        };

        img.src = imgUrl;
        card.appendChild(img);

        const label = document.createElement("div");
        label.className = "ref-label";
        label.innerHTML = `
          <span class="study-type">${study.type}</span>
          ${study.label}
        `;
        card.appendChild(label);

        card.onclick = () => {
          document.getElementById("modalImg").src = img.src;
          document.getElementById("modal").classList.add("active");
        };

        container.appendChild(card);
      });
    }

    // Initial Load
    renderPrompt(activePrompt);

    // Roll New Prompt
    document.getElementById("btnRoll").onclick = () => {
      const idx = Math.floor(Math.random() * CURATED_PROMPTS.length);
      activePrompt = CURATED_PROMPTS[idx];
      renderPrompt(activePrompt);
    };

    // Toggle Custom Input Drawer
    const customBox = document.getElementById("customInputBox");
    document.getElementById("btnToggleCustom").onclick = () => {
      customBox.classList.toggle("active");
      if (customBox.classList.contains("active")) {
        document.getElementById("customInput").focus();
      }
    };

    // Submit Custom Prompt
    document.getElementById("btnSubmitCustom").onclick = () => {
      const val = document.getElementById("customInput").value.trim();
      if (!val) return;
      activePrompt = {
        main: val,
        style: "Custom Style",
        palette: "Vibrant Lighting",
        detail: `key props and close-up textures from ${val}`,
        interior: `environment and space of ${val}`
      };
      customBox.classList.remove("active");
      renderPrompt(activePrompt);
    };

    // Native iOS Share
    document.getElementById("btnShare").onclick = async () => {
      if (navigator.share) {
        await navigator.share({
          title: "Art Prompt",
          text: activePrompt.main,
        });
      } else {
        navigator.clipboard.writeText(activePrompt.main);
        alert("Prompt copied to clipboard!");
      }
    };
  </script>
</body>
</html>
