<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ArtPrompt — Smart Word References</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ArtPrompt">
  <meta name="theme-color" content="#09090b">

  <!-- Embedded Web App Manifest -->
  <link rel="manifest" href="data:application/manifest+json;utf-8,%7B%22name%22%3A%22Smart%20Art%20Prompt%22%2C%22short_name%22%3A%22ArtPrompt%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2309090b%22%2C%22theme_color%22%3A%22%2309090b%22%7D">

  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(24, 24, 27, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #8b5cf6;
      --accent-gradient: linear-gradient(135deg, #8b5cf6, #d946ef);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: calc(env(safe-area-inset-top) + 14px);
      padding-bottom: calc(env(safe-area-inset-bottom) + 24px);
      padding-left: 16px;
      padding-right: 16px;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .badge {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(139, 92, 246, 0.18);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.35);
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 700;
    }

    .date-str {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Main Prompt Card */
    .prompt-card {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      margin-bottom: 20px;
    }

    .prompt-subtitle {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* Word Chips */
    .words-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .word-chip {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .word-index {
      font-size: 0.65rem;
      color: #a78bfa;
      font-weight: 700;
      background: rgba(139, 92, 246, 0.2);
      padding: 2px 6px;
      border-radius: 6px;
    }

    /* Reference Buttons Grid */
    .ref-btn-section-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .ref-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    button {
      border: none;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 14px;
      font-weight: 600;
      transition: transform 0.12s ease, background 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-ref {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: #f4f4f5;
      padding: 11px 14px;
      font-size: 0.88rem;
      justify-content: space-between;
    }

    .btn-ref.active {
      border-color: #a78bfa;
      background: rgba(139, 92, 246, 0.2);
      color: #fff;
    }

    .btn-ref-combined {
      background: var(--accent-gradient);
      color: #fff;
      padding: 12px 14px;
      font-size: 0.92rem;
      box-shadow: 0 4px 16px rgba(139, 92, 246, 0.35);
      border: none;
    }

    /* Bottom Control Bar */
    .controls {
      display: flex;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
    }

    .btn-reroll {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: #e4e4e7;
      padding: 12px 16px;
      font-size: 0.95rem;
    }

    .btn-share {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text);
      width: 48px;
      height: 48px;
      border-radius: 14px;
    }

    /* References Gallery */
    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .gallery-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 34px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .ref-card {
      position: relative;
      height: 220px;
      border-radius: 18px;
      overflow: hidden;
      background: #141416;
      border: 1px solid var(--card-border);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .ref-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .ref-card img.loaded {
      opacity: 1;
    }

    .ref-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 14px;
      background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.2) 80%, transparent);
      font-size: 0.78rem;
      font-weight: 600;
      color: #fff;
    }

    .study-tag {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #c4b5fd;
      display: block;
      margin-bottom: 2px;
    }

    /* Skeleton Loading State */
    .skeleton {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%);
      background-size: 200% 100%;
      animation: pulse 1.6s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Modal / Lightbox */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 100;
      padding: 16px;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 14px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <header>
    <span class="badge">Art Prompt Studio</span>
    <span class="date-str" id="currentDate">Today</span>
  </header>

  <main>
    <!-- Smart Words Card -->
    <div class="prompt-card">
      <div class="prompt-subtitle">Visual Spark Words</div>
      <div class="words-container" id="wordsContainer"></div>

      <div class="ref-btn-section-label">Fetch Visual References (3 Studies)</div>
      <div class="ref-buttons" id="refButtons"></div>

      <div class="controls">
        <button class="btn-reroll" id="btnReroll">
          <span style="font-size: 1.15rem; line-height: 1;">🙁</span>
          No likey :(
        </button>

        <button class="btn-share" id="btnShare" aria-label="Share">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
          </svg>
        </button>
      </div>
    </div>

    <!-- References Gallery -->
    <div class="gallery-header">
      <h2 class="gallery-title" id="galleryTitle">References</h2>
      <span class="date-str" id="statusLabel">Idle</span>
    </div>

    <div class="gallery" id="galleryContainer">
      <div class="empty-state">
        Select a button above to generate 3 targeted reference studies for a single word or the full combination.
      </div>
    </div>
  </main>

  <!-- Fullscreen Lightbox -->
  <div class="modal" id="modal" onclick="this.classList.remove('active')">
    <img id="modalImg" src="" alt="Fullscreen reference">
  </div>

  <script>
    // Curated Conceptual Word Banks
    const BUCKET_SUBJECTS = [
      "Leviathan", "Alchemist", "Golem", "Locomotive", "Astronaut", "Gargoyle",
      "Lighthouse", "Marionette", "Scarecrow", "Clockwork", "Relic", "Nomad",
      "Samurai", "Jellyfish", "Beekeeper", "Diver", "Hermit", "Monolith"
    ];

    const BUCKET_TEXTURES = [
      "Obsidian", "Bioluminescent", "Crystalline", "Overgrown", "Molten",
      "Porcelain", "Submerged", "Corroded", "Prismatic", "Verdant", "Gilded",
      "Spectral", "Shattered", "Driftwood", "Iridescent", "Neon"
    ];

    const BUCKET_ENVIRONMENTS = [
      "Cathedral", "Eclipse", "Trench", "Nebula", "Catacombs", "Monsoon",
      "Sanctuary", "Permafrost", "Abyss", "Dunes", "Greenhouse", "Foundry",
      "Archway", "Canopy", "Spire"
    ];

    let currentWords = [];

    // Smart Generator: Combines buckets into evocative pairs or triplets
    function generateSmartWords() {
      const isTriplet = Math.random() > 0.35; // ~65% chance of 3 words, 35% chance of 2
      const subject = BUCKET_SUBJECTS[Math.floor(Math.random() * BUCKET_SUBJECTS.length)];
      const texture = BUCKET_TEXTURES[Math.floor(Math.random() * BUCKET_TEXTURES.length)];
      const env = BUCKET_ENVIRONMENTS[Math.floor(Math.random() * BUCKET_ENVIRONMENTS.length)];

      if (isTriplet) {
        return [texture, subject, env];
      } else {
        return Math.random() > 0.5 ? [texture, subject] : [subject, env];
      }
    }

    function renderUI() {
      // 1. Render Words
      const wordsContainer = document.getElementById("wordsContainer");
      wordsContainer.innerHTML = currentWords.map((word, i) => `
        <div class="word-chip">
          <span class="word-index">${i + 1}</span>
          ${word}
        </div>
      `).join("");

      // 2. Render Reference Buttons
      const btnContainer = document.getElementById("refButtons");
      let buttonsHtml = currentWords.map((word, i) => `
        <button class="btn-ref" onclick="fetchReferencesFor('${word}', 'Word: ${word}')">
          <span>Generate reference for <strong>${word}</strong></span>
          <span style="color:#a78bfa">→</span>
        </button>
      `).join("");

      // Combined Button
      const combinedQuery = currentWords.join(" ");
      buttonsHtml += `
        <button class="btn-ref btn-ref-combined" onclick="fetchReferencesFor('${combinedQuery}', 'Combined: ${combinedQuery}')">
          <span>✨ Generate combined reference (${currentWords.length} words)</span>
          <span>→</span>
        </button>
      `;

      btnContainer.innerHTML = buttonsHtml;

      // Reset gallery to empty state
      document.getElementById("galleryContainer").innerHTML = `
        <div class="empty-state">
          Select a button above to generate 3 targeted reference studies.
        </div>
      `;
      document.getElementById("statusLabel").textContent = "Idle";
      document.getElementById("galleryTitle").textContent = "References";
    }

    // Pull or Generate 3 targeted visual references
    function fetchReferencesFor(query, titleLabel) {
      const container = document.getElementById("galleryContainer");
      const statusLabel = document.getElementById("statusLabel");
      const galleryTitle = document.getElementById("galleryTitle");

      galleryTitle.textContent = titleLabel;
      statusLabel.textContent = "Rendering 3 studies...";

      // 3 Targeted studies for artists (Composition, Texture/Material, Lighting/Atmosphere)
      const seedBase = Math.floor(Math.random() * 89999) + 1000;
      const studies = [
        {
          tag: "Study 1 • Composition & Form",
          desc: `Full scene study of ${query}`,
          prompt: `${query}, visual concept art, strong focal point composition, masterwork painting --seed ${seedBase}`
        },
        {
          tag: "Study 2 • Detail & Material Texture",
          desc: `Close-up texture and details of ${query}`,
          prompt: `Macro detail study of ${query}, intricate textures, materials, high definition concept reference --seed ${seedBase + 1}`
        },
        {
          tag: "Study 3 • Lighting & Color Mood",
          desc: `Atmospheric lighting and palette for ${query}`,
          prompt: `Dramatic lighting and evocative atmosphere study of ${query}, cinematic lighting, color mood study --seed ${seedBase + 2}`
        }
      ];

      // Insert Skeletons
      container.innerHTML = studies.map(() => `
        <div class="ref-card">
          <div class="skeleton"></div>
        </div>
      `).join("");

      let loadedCount = 0;

      // Render 3 Images
      container.innerHTML = "";
      studies.forEach((study) => {
        const card = document.createElement("div");
        card.className = "ref-card";

        const skeleton = document.createElement("div");
        skeleton.className = "skeleton";
        card.appendChild(skeleton);

        const img = document.createElement("img");
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(study.prompt)}?width=800&height=560&nologo=true`;

        img.onload = () => {
          skeleton.remove();
          img.classList.add("loaded");
          loadedCount++;
          if (loadedCount >= studies.length) {
            statusLabel.textContent = "Ready";
          }
        };

        img.onerror = () => {
          skeleton.remove();
          img.src = `https://picsum.photos/seed/${encodeURIComponent(study.desc)}/800/560`;
          img.classList.add("loaded");
        };

        img.src = imgUrl;
        img.alt = study.desc;
        card.appendChild(img);

        const label = document.createElement("div");
        label.className = "ref-label";
        label.innerHTML = `
          <span class="study-tag">${study.tag}</span>
          ${study.desc}
        `;
        card.appendChild(label);

        card.onclick = () => {
          document.getElementById("modalImg").src = img.src;
          document.getElementById("modal").classList.add("active");
        };

        container.appendChild(card);
      });
    }

    // Set Date
    const today = new Date();
    document.getElementById("currentDate").textContent = today.toLocaleDateString("en-US", { month: "short", day: "numeric", weekday: "short" });

    // Initial Roll
    currentWords = generateSmartWords();
    renderUI();

    // Reroll Button: "No likey :("
    document.getElementById("btnReroll").onclick = () => {
      currentWords = generateSmartWords();
      renderUI();
    };

    // Native iOS Share
    document.getElementById("btnShare").onclick = async () => {
      const shareText = `Art Prompt Words: ${currentWords.join(" • ")}`;
      if (navigator.share) {
        await navigator.share({ title: "Smart Art Prompt", text: shareText });
      } else {
        navigator.clipboard.writeText(shareText);
        alert("Prompt words copied to clipboard!");
      }
    };
  </script>
</body>
</html>
