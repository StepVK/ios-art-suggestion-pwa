<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ArtPrompt — Split Pinterest Spark</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ArtPrompt">
  <meta name="theme-color" content="#09090b">

  <!-- Embedded Web App Manifest -->
  <link rel="manifest" href="data:application/manifest+json;utf-8,%7B%22name%22%3A%22Art%20Prompt%20Spark%22%2C%22short_name%22%3A%22ArtPrompt%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2309090b%22%2C%22theme_color%22%3A%22%2309090b%22%7D">

  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(24, 24, 27, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #8b5cf6;
      --pinterest-red: #e60023;
      --gradient-concept: linear-gradient(135deg, rgba(230, 0, 35, 0.35) 0%, rgba(139, 92, 246, 0.45) 100%);
      --gradient-combined-concept: linear-gradient(135deg, #e60023 0%, #8b5cf6 100%);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: calc(env(safe-area-inset-top) + 16px);
      padding-bottom: calc(env(safe-area-inset-bottom) + 24px);
      padding-left: 18px;
      padding-right: 18px;
      justify-content: space-between;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(139, 92, 246, 0.18);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.35);
      padding: 5px 12px;
      border-radius: 9999px;
      font-weight: 700;
    }

    .date-str {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Main Container */
    .content {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
      justify-content: center;
      margin-bottom: 20px;
    }

    .instruction-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: -4px;
      padding: 0 4px;
      font-weight: 600;
    }

    /* Split Cards Container */
    .words-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .split-card {
      display: flex;
      border-radius: 20px;
      overflow: hidden;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      min-height: 74px;
    }

    /* Common Button Reset */
    button {
      border: none;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      transition: transform 0.1s ease, opacity 0.1s ease;
    }

    button:active {
      transform: scale(0.97);
      opacity: 0.85;
    }

    /* Left Side: Exact Search */
    .split-side-left {
      flex: 1.4;
      background: transparent;
      padding: 14px 16px;
      justify-content: space-between;
      text-align: left;
    }

    .word-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .word-text {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .word-category {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #a78bfa;
      font-weight: 700;
    }

    .word-category.style-tag {
      color: #f472b6;
    }

    .exact-indicator {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      align-self: flex-start;
      margin-top: 4px;
    }

    /* Right Side: Gradient Concept Search */
    .split-side-right {
      flex: 1;
      background: var(--gradient-concept);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px 14px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 2px;
      position: relative;
    }

    .concept-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .concept-subtitle {
      font-size: 0.65rem;
      color: #fbcfe8;
      font-weight: 600;
      opacity: 0.9;
    }

    /* Combined Split Card */
    .split-card-combined {
      margin-top: 4px;
      border-color: rgba(230, 0, 35, 0.35);
      box-shadow: 0 8px 26px rgba(230, 0, 35, 0.25);
    }

    .split-card-combined .split-side-left {
      background: rgba(255, 255, 255, 0.04);
      flex: 1.2;
    }

    .split-card-combined .split-side-right {
      background: var(--gradient-combined-concept);
      flex: 1;
    }

    /* Bottom Controls */
    .controls {
      display: flex;
      gap: 10px;
      padding-top: 12px;
    }

    .btn-reroll {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: #e4e4e7;
      padding: 15px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 16px;
      gap: 8px;
      justify-content: center;
    }

    .btn-share {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text);
      width: 52px;
      height: 52px;
      border-radius: 16px;
      justify-content: center;
    }
  </style>
</head>
<body>

  <header>
    <span class="badge">Pinterest Spark</span>
    <span class="date-str" id="currentDate">Today</span>
  </header>

  <main class="content">
    <div class="instruction-label">
      <span>Left: Exact Match</span>
      <span>Right: + Concept Art</span>
    </div>
    
    <!-- Word Split Cards Stack -->
    <div class="words-stack" id="wordsContainer"></div>

    <!-- Combined Split Card -->
    <div class="split-card split-card-combined" id="combinedContainer"></div>
  </main>

  <!-- Bottom Actions -->
  <div class="controls">
    <button class="btn-reroll" id="btnReroll">
      <span style="font-size: 1.2rem; line-height: 1;">🙁</span>
      <span>No likey :(</span>
    </button>

    <button class="btn-share" id="btnShare" aria-label="Share">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
      </svg>
    </button>
  </div>

  <script>
    // ==========================================
    // 7 CURATED BUCKETS (500+ Words)
    // ==========================================
    const BUCKETS = {
      // 1. Themes & Stylistic Movements
      themes: [
        "Sci-Fi", "Cyberpunk", "Steampunk", "Solarpunk", "Fantasy", "Dark-Fantasy",
        "High-Fantasy", "Grimdark", "Post-Apocalyptic", "Biopunk", "Dieselpunk",
        "Atompunk", "Space-Opera", "Mecha", "Retro-Futurism", "Art-Nouveau",
        "Art-Deco", "Baroque", "Rococo", "Gothic", "Bauhaus", "Brutalism",
        "Surrealism", "Noir", "Vaporwave", "Synthwave", "Ukiyo-e", "Impressionism",
        "Pre-Raphaelite", "Lovecraftian", "Eldritch", "Folk-Horror", "Afrofuturism",
        "Liminal", "Psychedelic", "Minimalist", "Industrial", "Cottagecore", "Chiaroscuro",
        "Constructivism", "Fairy-Tale", "Mythological", "Romanticism", "Suprematism",
        "Cassette-Futurism", "Sword-and-Sorcery", "Solar-Gothic", "Cyber-Noir"
      ],

      // 2. Archetypes & Figures
      archetypes: [
        "Alchemist", "Falconer", "Diver", "Cartographer", "Beekeeper", "Hermit", "Samurai",
        "Astronaut", "Marionette", "Gargoyle", "Clockmaker", "Monk", "Blacksmith", "Miner",
        "Nomad", "Oracle", "Scribe", "Sculptor", "Weaver", "Harvester", "Sorcerer",
        "Jester", "Centurion", "Gladiator", "Archer", "Bard", "Shaman", "Druid",
        "Botanist", "Navigator", "Glassblower", "Tinkerer", "Astronomer", "Geologist",
        "Executioner", "Shepherd", "Potter", "Engraver", "Pilgrim", "Warlock", "Necromancer",
        "Paladin", "Herbalist", "Corsair", "Squire", "Librarian", "Sentinel", "Locksmith"
      ],

      // 3. Fauna & Creatures
      creatures: [
        "Nautilus", "Axolotl", "Pangolin", "Jellyfish", "Chameleon", "Manta", "Raven",
        "Beetle", "Dragonfly", "Scorpion", "Octopus", "Owl", "Whale", "Moth", "Salamander",
        "Seahorse", "Viper", "Barnacle", "Stag", "Barracuda", "Heron", "Armadillo",
        "Pelican", "Peacock", "Crab", "Firefly", "Tortoise", "Falcon", "Lynx", "Badger",
        "Otter", "Iguana", "Stingray", "Squid", "Lobster", "Caterpillar", "Cicada",
        "Mantis", "Toad", "Cuttlefish", "Crow", "Vulture", "Porcupine", "Walrus", "Narwhal"
      ],

      // 4. Artifacts, Objects & Architecture
      objects: [
        "Lighthouse", "Astrolabe", "Locomotive", "Monolith", "Sarcophagus", "Windmill",
        "Pagoda", "Reliquary", "Gargoyle", "Greenhouse", "Bathhouse", "Sundial",
        "Catapult", "Anvil", "Telescope", "Belfry", "Crucible", "Aqueduct", "Carillon",
        "Viaduct", "Archway", "Crypt", "Foundry", "Cenotaph", "Armillary", "Hourglass",
        "Compass", "Lantern", "Sextant", "Cauldron", "Tapestry", "Mosaic", "Kiln",
        "Loom", "Millstone", "Censer", "Wellspring", "Drawbridge", "Portcullis", "Spire"
      ],

      // 5. Materials, Textures & Elements
      materials: [
        "Obsidian", "Verdigris", "Basalt", "Porcelain", "Terracotta", "Crystalline",
        "Bioluminescent", "Corroded", "Gilded", "Molten", "Driftwood", "Amber", "Pumice",
        "Malachite", "Quicksilver", "Lapis", "Tallow", "Pewter", "Alabaster", "Bronze",
        "Brass", "Copper", "Pyrite", "Motherofpearl", "Onyx", "Flint", "Slate", "Marble",
        "Limestone", "Sandstone", "Granite", "Cobalt", "Brimstone", "Cinnabar", "Feldspar"
      ],

      // 6. Environments & Biomes
      environments: [
        "Cenote", "Caldera", "Mangrove", "Fjord", "Cathedral", "Archipelago", "Permafrost",
        "Trench", "Saltflat", "Canyon", "Glacier", "Wetland", "Steppe", "Taiga",
        "Badlands", "Atoll", "Gorge", "Ravine", "Delta", "Oasis", "Estuary",
        "Lagoon", "Geyser", "Savanna", "Moorland", "Dune", "Chasm", "Quarry", "Crater"
      ],

      // 7. Atmospheres & Phenomena
      atmospheres: [
        "Eclipse", "Monsoon", "Aurora", "Mirage", "Sirocco", "Solstice", "Twilight",
        "Blizzard", "Haze", "Tempest", "Afterglow", "Downpour", "Fog", "Smog",
        "Rainbow", "Sundog", "Squall", "Drizzle", "Gale", "Cyclone", "Tornado"
      ]
    };

    let currentWordsData = [];

    // Generator: Combines buckets into evocative, paintable 2 or 3 word sets
    function generateSmartWords() {
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
      const isTriplet = Math.random() > 0.3; // 70% chance of 3 words, 30% chance of 2

      const patterns = [
        // Pattern 1: Theme + Creature + Environment (e.g. Cyberpunk • Nautilus • Cenote)
        () => [
          { word: pick(BUCKETS.themes), category: "Theme / Style", isStyle: true },
          { word: pick(BUCKETS.creatures), category: "Creature" },
          { word: pick(BUCKETS.environments), category: "Biome" }
        ],
        // Pattern 2: Theme + Material + Object (e.g. Art-Nouveau • Obsidian • Lighthouse)
        () => [
          { word: pick(BUCKETS.themes), category: "Theme / Style", isStyle: true },
          { word: pick(BUCKETS.materials), category: "Material" },
          { word: pick(BUCKETS.objects), category: "Object" }
        ],
        // Pattern 3: Theme + Figure + Atmosphere (e.g. Solarpunk • Falconer • Mirage)
        () => [
          { word: pick(BUCKETS.themes), category: "Theme / Style", isStyle: true },
          { word: pick(BUCKETS.archetypes), category: "Figure" },
          { word: pick(BUCKETS.atmospheres), category: "Atmosphere" }
        ],
        // Pattern 4: Theme + Figure + Object (e.g. Steampunk • Beekeeper • Hourglass)
        () => [
          { word: pick(BUCKETS.themes), category: "Theme / Style", isStyle: true },
          { word: pick(BUCKETS.archetypes), category: "Figure" },
          { word: pick(BUCKETS.objects), category: "Object" }
        ],
        // Pattern 5: Material + Creature + Biome (e.g. Gilded • Axolotl • Lagoon)
        () => [
          { word: pick(BUCKETS.materials), category: "Material" },
          { word: pick(BUCKETS.creatures), category: "Creature" },
          { word: pick(BUCKETS.environments), category: "Biome" }
        ]
      ];

      const selectedPattern = pick(patterns)();
      return isTriplet ? selectedPattern : selectedPattern.slice(0, 2);
    }

    // Opens Pinterest: with or without the "+ concept art reference" modifier
    function openPinterest(query, addConcept = false) {
      let clean = query.replace(/-/g, " ").trim();
      if (addConcept) {
        clean += " concept art reference";
      }
      const url = `https://www.pinterest.com/search/pins/?q=${encodeURIComponent(clean)}`;
      window.open(url, '_blank');
    }

    function renderUI() {
      const container = document.getElementById("wordsContainer");

      // Render each word as a 2-part split card
      container.innerHTML = currentWordsData.map((item) => `
        <div class="split-card">
          <!-- Left: Exact Match -->
          <button class="split-side-left" onclick="openPinterest('${item.word}', false)">
            <div class="word-info">
              <span class="word-category ${item.isStyle ? 'style-tag' : ''}">${item.category}</span>
              <span class="word-text">${item.word}</span>
              <span class="exact-indicator">Exact ↗</span>
            </div>
          </button>

          <!-- Right: Gradient Concept Art -->
          <button class="split-side-right" onclick="openPinterest('${item.word}', true)">
            <span class="concept-title">🎨 Concept</span>
            <span class="concept-subtitle">+ Reference ↗</span>
          </button>
        </div>
      `).join("");

      // Render the Combined prompt split card
      const combinedContainer = document.getElementById("combinedContainer");
      const combinedWords = currentWordsData.map(d => d.word).join(" ");
      
      combinedContainer.innerHTML = `
        <!-- Left: Combined Exact -->
        <button class="split-side-left" onclick="openPinterest('${combinedWords}', false)">
          <div class="word-info">
            <span class="word-category">All Combined</span>
            <span class="word-text" style="font-size: 1.15rem;">${combinedWords}</span>
            <span class="exact-indicator">Exact Search ↗</span>
          </div>
        </button>

        <!-- Right: Combined Gradient Concept -->
        <button class="split-side-right" onclick="openPinterest('${combinedWords}', true)">
          <span class="concept-title">✨ Concept Art</span>
          <span class="concept-subtitle">All Combined ↗</span>
        </button>
      `;
    }

    // Initialize Date
    const today = new Date();
    document.getElementById("currentDate").textContent = today.toLocaleDateString("en-US", { month: "short", day: "numeric", weekday: "short" });

    // Initial Roll
    currentWordsData = generateSmartWords();
    renderUI();

    // Reroll Button: "No likey :("
    document.getElementById("btnReroll").onclick = () => {
      currentWordsData = generateSmartWords();
      renderUI();
    };

    // Native iOS Share
    document.getElementById("btnShare").onclick = async () => {
      const wordsList = currentWordsData.map(d => d.word).join(" • ");
      const shareText = `Art Prompt Words: ${wordsList}`;
      if (navigator.share) {
        await navigator.share({ title: "Art Prompt Spark", text: shareText });
      } else {
        navigator.clipboard.writeText(shareText);
        alert("Prompt words copied to clipboard!");
      }
    };
  </script>
</body>
</html>
